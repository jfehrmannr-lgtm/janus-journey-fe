<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  width="256"
  height="256"
>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172D50" />
      <stop offset="1" stop-color="#385783" />
    </linearGradient>

    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B66E" />
      <stop offset="1" stop-color="#FFE0A3" />
    </linearGradient>

    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5E7D9" />
      <stop offset="1" stop-color="#FFF7EA" />
    </linearGradient>

    <clipPath id="logoCircle">
      <circle cx="128" cy="128" r="128" />
    </clipPath>
  </defs>

  <g clip-path="url(#logoCircle)">
    <rect
      x="128"
      width="128"
      height="256"
      fill="url(#cream)"
    />

    <path
      d="
        M 128 64
        A 64 64 0 0 1 128 192
        Z
      "
      fill="url(#inner)"
    />

    <rect
      width="128"
      height="256"
      fill="url(#blue)"
    />
  </g>
</svg>